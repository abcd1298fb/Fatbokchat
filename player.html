<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Özel Gelişmiş HLS Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1015;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        /* Özel Kontrol Paneli */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-container:hover .controls-bar {
            opacity: 1;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            color: #3b82f6;
        }

        .time-display {
            font-size: 13px;
            color: #ddd;
            min-width: 80px;
        }

        .spacer {
            flex-grow: 1;
        }

        select, input[type="range"] {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        input[type="range"] {
            width: 80px;
            accent-color: #3b82f6;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- Yerel kontrolleri kapattık, kendi panelimizi kullanıyoruz -->
        <video id="videoPlayer"></video>

        <div class="controls-bar" id="controlsBar">
            <button id="playPauseBtn" title="Oynat/Duraklat">▶</button>
            
            <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
            
            <div class="control-group">
                <span>Ses:</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="control-group">
                <span>Parlaklık:</span>
                <input type="range" id="brightnessRange" min="0.5" max="1.5" step="0.1" value="1">
            </div>

            <div class="spacer"></div>

            <div class="control-group">
                <span>Kalite:</span>
                <select id="qualitySelect" disabled>
                    <option value="">Yükleniyor...</option>
                </select>
            </div>

            <button id="fullscreenBtn" title="Tam Ekran">⛶</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const playerContainer = document.getElementById('playerContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeRange = document.getElementById('volumeRange');
        const brightnessRange = document.getElementById('brightnessRange');
        const qualitySelect = document.getElementById('qualitySelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const masterPlaylistUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
        let mediaSource = null;

        // --- 1. ARAYÜZ KONTROLLERİ ---

        // Oynat / Duraklat
        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        function togglePlay() {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
            }
        }

        // Süre Takibi
        video.addEventListener('timeupdate', () => {
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Ses Ayarı
        volumeRange.addEventListener('input', (e) => {
            video.volume = e.target.value;
        });

        // Parlaklık Ayarı (CSS Filtresi ile)
        brightnessRange.addEventListener('input', (e) => {
            video.style.filter = `brightness(${e.target.value})`;
        });

        // Tam Ekran
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    console.error('Tam ekran hatası:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // --- 2. HLS VE MSE MOTORU ---

        if ('MediaSource' in window) {
            initHLS(masterPlaylistUrl);
        } else {
            alert('Tarayıcınız Media Source Extensions (MSE) desteklemiyor.');
        }

        async function initHLS(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const variants = parseMasterPlaylist(text, url);

                if (variants.length > 0) {
                    setupQualitySelector(variants);
                    loadStream(variants[0].url);
                } else {
                    loadStream(url);
                }
            } catch (err) {
                console.error('HLS başlatılamadı:', err);
            }
        }

        function parseMasterPlaylist(manifest, baseUrl) {
            const lines = manifest.split('\n');
            const variants = [];
            let currentBase = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
            let currentBandwidth = 0;
            let currentResolution = 'Bilinmiyor';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXT-X-STREAM-INF:')) {
                    const bwMatch = line.match(/BANDWIDTH=(\d+)/);
                    const resMatch = line.match(/RESOLUTION=([0-9x]+)/);
                    currentBandwidth = bwMatch ? parseInt(bwMatch[1]) : 0;
                    currentResolution = resMatch ? resMatch[1] : 'Standart';
                } else if (line && !line.startsWith('#')) {
                    variants.push({
                        bandwidth: currentBandwidth,
                        resolution: currentResolution,
                        url: line.startsWith('http') ? line : currentBase + line
                    });
                    currentBandwidth = 0;
                    currentResolution = 'Bilinmiyor';
                }
            }
            return variants.sort((a, b) => b.bandwidth - a.bandwidth);
        }

        function setupQualitySelector(variants) {
            qualitySelect.innerHTML = '';
            variants.forEach((variant) => {
                const option = document.createElement('option');
                option.value = variant.url;
                option.text = `${variant.resolution} (${Math.round(variant.bandwidth / 1000)} kbps)`;
                qualitySelect.appendChild(option);
            });
            qualitySelect.disabled = false;

            qualitySelect.addEventListener('change', (e) => {
                loadStream(e.target.value);
            });
        }

        async function loadStream(playlistUrl) {
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch(e) {}
            }

            mediaSource = new MediaSource();
            video.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', async () => {
                try {
                    const res = await fetch(playlistUrl);
                    const text = await res.text();
                    const segments = parseMediaPlaylist(text, playlistUrl);

                    const mimeCodec = 'video/mp4; codecs="avc1.4d401f, mp4a.40.2"';
                    if (!MediaSource.isTypeSupported(mimeCodec)) return;

                    const sourceBuffer = mediaSource.addSourceBuffer(mimeCodec);
                    loadSegmentsSequentially(segments, sourceBuffer, mediaSource);
                } catch (e) {
                    console.error('Akış yüklenemedi:', e);
                }
            });
        }

        function parseMediaPlaylist(manifest, baseUrl) {
            const lines = manifest.split('\n');
            const segments = [];
            let currentBase = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line.startsWith('#') && line.length > 0) {
                    segments.push(line.startsWith('http') ? line : currentBase + line);
                }
            }
            return segments;
        }

        async function loadSegmentsSequentially(segments, sourceBuffer, mediaSource) {
            for (let i = 0; i < segments.length; i++) {
                if (mediaSource.readyState !== 'open') break;

                const url = segments[i];
                try {
                    const res = await fetch(url);
                    const arrayBuffer = await res.arrayBuffer();

                    await new Promise((resolve) => {
                        if (!sourceBuffer.updating) resolve();
                        else sourceBuffer.addEventListener('updateend', resolve, { once: true });
                    });

                    if (mediaSource.readyState === 'open') {
                        sourceBuffer.appendBuffer(arrayBuffer);
                    }
                } catch (e) {
                    console.error('Segment hatası:', url);
                }
            }

            sourceBuffer.addEventListener('updateend', () => {
                if (mediaSource.readyState === 'open') {
                    try { mediaSource.endOfStream(); } catch (err) {}
                }
            }, { once: true });
        }
    </script>
</body>
</html>
