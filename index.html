<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkronize M3U8 İzleme</title>
    <!-- HLS.js kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        .controls {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            width: 320px;
            border-radius: 4px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            border-radius: 4px;
            border: none;
            background: #007bff;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }
        button:hover { background: #0056b3; }
        .video-container {
            display: flex;
            justify-content: center;
        }
        video {
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Birlikte M3U8 İzleme Odası</h1>
    
    <div class="controls">
        <input type="text" id="m3u8Url" placeholder="M3U8 akış linkini buraya yapıştır...">
        <button id="loadBtn">Videoyu Yükle</button>
    </div>

    <div class="video-container">
        <video id="video" controls playsinline></video>
    </div>

    <!-- Socket.io istemci kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('video');
        const urlInput = document.getElementById('m3u8Url');
        const loadBtn = document.getElementById('loadBtn');

        const roomID = "ortak-oda-1"; // İki kişilik sabit oda
        socket.emit('join-room', roomID);

        let isUpdatingFromRemote = false; // Sonsuz tetikleme döngüsünü önlemek için

        // M3U8 linkini yükleme fonksiyonu
        function playHLS(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari gibi yerel HLS desteği olan tarayıcılar için
                video.src = url;
            }
        }

        // Arayüzden "Videoyu Yükle" butonuna basıldığında
        loadBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) {
                playHLS(url);
                socket.emit('change-source', { roomID, url });
            }
        });

        // Diğer kullanıcı kaynak değiştirdiğinde tetiklenir
        socket.on('remote-change-source', (url) => {
            urlInput.value = url;
            playHLS(url);
        });

        // --- YEREL VİDEO KONTROLLERİ (Karşı tarafa haber ver) ---

        video.addEventListener('play', () => {
            if (isUpdatingFromRemote) return;
            socket.emit('play-video', { roomID, currentTime: video.currentTime });
        });

        video.addEventListener('pause', () => {
            if (isUpdatingFromRemote) return;
            socket.emit('pause-video', { roomID, currentTime: video.currentTime });
        });

        video.addEventListener('seeked', () => {
            if (isUpdatingFromRemote) return;
            socket.emit('seek-video', { roomID, currentTime: video.currentTime });
        });

        // --- UZAKTAN GELEN KOMUTLAR (Karşı tarafın hareketini uygula) ---

        socket.on('remote-play', (currentTime) => {
            isUpdatingFromRemote = true;
            video.currentTime = currentTime;
            video.play().then(() => {
                isUpdatingFromRemote = false;
            }).catch(() => {
                isUpdatingFromRemote = false;
            });
        });

        socket.on('remote-pause', (currentTime) => {
            isUpdatingFromRemote = true;
            video.currentTime = currentTime;
            video.pause();
            isUpdatingFromRemote = false;
        });

        socket.on('remote-seek', (currentTime) => {
            isUpdatingFromRemote = true;
            video.currentTime = currentTime;
            isUpdatingFromRemote = false;
        });
    </script>
</body>
</html>
