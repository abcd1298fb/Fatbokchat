<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkronize La Casa de Papel</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 10px 15px;
            border-radius: 4px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        select { background: #222; color: #fff; border: 1px solid #444; }
        button {
            background: #007bff;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        .video-container {
            display: flex;
            justify-content: center;
        }
        video {
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>La Casa de Papel - Senkronize İzleme Odası</h1>
    
    <div class="controls">
        <select id="seasonSelect">
            <option value="">Sezon Seçin</option>
        </select>
        <select id="episodeSelect" disabled>
            <option value="">Önce Sezon Seçin</option>
        </select>
        <button id="loadBtn">Bölümü Başlat</button>
    </div>

    <div class="video-container">
        <video id="video" controls playsinline></video>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            transports: ['websocket', 'polling']
        });

        const video = document.getElementById('video');
        const seasonSelect = document.getElementById('seasonSelect');
        const episodeSelect = document.getElementById('episodeSelect');
        const loadBtn = document.getElementById('loadBtn');

        const roomID = "ortak-oda-1";
        socket.emit('join-room', roomID);

        let isRemoteAction = false; // Uzaktan gelen komutları ayırt etmek için

        const diziVerileri = {
            "La Casa de Papel - 1. Sezon": [
                { baslik: "8. Bölüm", url: "https://s429.rapidrame.com/hls2/01/00012/atxktqn9qw0e_,l,.urlset/master.m3u8?t=Gdg3331gbcCc6gzNHRI2nu_0m0NN8j5-SsfOsHGQ20A&s=1787509702&e=14400&f=61539&i=0.0&sp=0&n=4jyob6dgynsl6d1g" },
                { baslik: "9. Bölüm", url: "https://s429.rapidrame.com/hls2/01/00012/afllini891lf_,l,.urlset/master.m3u8?t=M97pzD_5IGWpr2HVuhJXutGk9On1wTOa8q48M_fzEeI&s=1787509746&e=14400&f=61684&i=0.0&sp=0&n=9gec5hoy45wahlao" },
                { baslik: "10. Bölüm", url: "https://s429.rapidrame.com/hls2/01/00012/ncxad8r5guje_,l,.urlset/master.m3u8?t=p9_7XI-clbfRVZsIgcuaScisD3vGShj1sfftbnXTd08&s=1787509763&e=14400&f=61715&i=0.0&sp=0&n=4w1dc8y2z4z2rpta" },
                { baslik: "11. Bölüm", url: "https://s429.rapidrame.com/hls2/01/00007/z53u6z2d5xsf_,l,.urlset/master.m3u8?t=VX_phBjCaF0x8DoTH594eeex-vwo-CGI_d7L-U79V2k&s=1787509780&e=14400&f=38778&i=0.0&sp=0&n=udphr3kwav4d73c1" },
                { baslik: "12. Bölüm", url: "https://s231.rapidrame.com/hls2/01/00007/d5k0wzq9f8hc_,l,.urlset/master.m3u8?t=z07vLzESiHS_BRFfhcF326rua0XvXsYGVy1ponBVEUA&s=1787509793&e=14400&f=38779&srv=s429&i=0.0&sp=0&n=qtbav44py9jm0d2e&p1=s231&p2=s231" },
                { baslik: "13. Bölüm", url: "https://s429.rapidrame.com/hls2/01/00007/5fkj4f3x4nhf_,l,.urlset/master.m3u8?t=Hq26emVpUlmBOdz8DnuhiUp8Q3sgInfGMTWHwX6ZuKw&s=1787509817&e=14400&f=38781&i=0.0&sp=0&n=d487og019h0z9ion" }
            ]
        };

        function initSeasons() {
            for (const sezon in diziVerileri) {
                let opt = document.createElement('option');
                opt.value = sezon;
                opt.textContent = sezon;
                seasonSelect.appendChild(opt);
            }
        }

        seasonSelect.addEventListener('change', () => {
            const secilenSezon = seasonSelect.value;
            episodeSelect.innerHTML = '<option value="">Bölüm Seçin</option>';
            
            if (secilenSezon && diziVerileri[secilenSezon]) {
                episodeSelect.disabled = false;
                diziVerileri[secilenSezon].forEach((bolum, index) => {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = bolum.baslik;
                    episodeSelect.appendChild(opt);
                });
            } else {
                episodeSelect.disabled = true;
            }
        });

        function playHLS(url) {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 30, // Tampon belleği optimize et
                    maxMaxBufferLength: 60
                });
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }

        loadBtn.addEventListener('click', () => {
            const sezon = seasonSelect.value;
            const bolumIndex = episodeSelect.value;

            if (sezon !== "" && bolumIndex !== "") {
                const url = diziVerileri[sezon][bolumIndex].url;
                playHLS(url);
                socket.emit('change-source', { roomID, url });
            } else {
                alert("Lütfen bir sezon ve bölüm seçin!");
            }
        });

        socket.on('remote-change-source', (url) => {
            playHLS(url);
        });

        // --- KARARLI SENKRONİZASYON ---

        video.addEventListener('play', () => {
            if (isRemoteAction) return;
            socket.emit('play-video', { roomID, currentTime: video.currentTime });
        });

        video.addEventListener('pause', () => {
            if (isRemoteAction) return;
            socket.emit('pause-video', { roomID, currentTime: video.currentTime });
        });

        video.addEventListener('seeked', () => {
            if (isRemoteAction) return;
            socket.emit('seek-video', { roomID, currentTime: video.currentTime });
        });

        socket.on('remote-play', (currentTime) => {
            isRemoteAction = true;
            if (Math.abs(video.currentTime - currentTime) > 1) {
                video.currentTime = currentTime;
            }
            video.play().catch(() => {});
            setTimeout(() => { isRemoteAction = false; }, 500);
        });

        socket.on('remote-pause', (currentTime) => {
            isRemoteAction = true;
            video.currentTime = currentTime;
            video.pause();
            setTimeout(() => { isRemoteAction = false; }, 500);
        });

        socket.on('remote-seek', (currentTime) => {
            isRemoteAction = true;
            video.currentTime = currentTime;
            setTimeout(() => { isRemoteAction = false; }, 500);
        });

        initSeasons();
    </script>
</body>
</html>
